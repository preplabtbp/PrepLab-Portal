# NOTE: File ini digunakan ketika Cloud Build Trigger aktif di Google Cloud Console.
# Untuk deploy manual via CLI, gunakan: npm run deploy:staging
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/preplab-portal-staging:$COMMIT_SHA', '.']
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/preplab-portal-staging:$COMMIT_SHA']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'preplab-portal-staging'
      - '--image'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/preplab-portal-staging:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast2'
      - '--project'
      - '$PROJECT_ID'
      - '--update-secrets'
      - 'JWT_SECRET=JWT_SECRET:latest'

  # Automated Security Guard Test Suite
  - name: 'node:20-slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm install --legacy-peer-deps
        TEST_BASE_URL=https://preplab-portal-staging-1034501170626.asia-southeast2.run.app npm test

images:
  - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/preplab-portal-staging:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
