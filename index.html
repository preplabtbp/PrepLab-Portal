<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="google" content="notranslate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=3" />
    <link rel="icon" type="image/png" href="/logo.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png?v=3" />
    <link rel="apple-touch-icon" href="/logo.png?v=3" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <title>Prep & Lab All in One Portal</title>
    <script>
      (function() {
        try {
          var nik = localStorage.getItem('p2h_inspector_nik');
          if (!nik) {
            var profile = localStorage.getItem('p2h_inspector_profile');
            if (profile) nik = JSON.parse(profile).nik;
          }
          var storageKey = nik ? 'preplab_user_themes_' + nik : 'preplab_user_themes_guest';
          var cached = localStorage.getItem(storageKey);
          var activeColors = localStorage.getItem('preplab_active_theme_colors');
          var colors = null;
          if (cached) {
            var parsed = JSON.parse(cached);
            var hour = new Date().getHours();
            var mode = (hour >= 5 && hour < 12) ? 'morning' : (hour >= 12 && hour < 18) ? 'afternoon' : 'evening';
            colors = parsed[mode] || parsed.morning || parsed.afternoon || parsed.evening || parsed;
          } else if (activeColors) {
            colors = JSON.parse(activeColors);
          }
          if (colors && typeof colors === 'object') {
            for (var key in colors) {
              if (key.indexOf('--') === 0 && colors[key]) {
                document.documentElement.style.setProperty(key, colors[key]);
              }
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <!-- PREPLAB VIDEO SPLASH SCREEN (Tampil otomatis saat buka aplikasi dari HP / Desktop) -->
    <div 
      id="preplab-splash-screen" 
      title="Ketuk untuk lewati"
      style="position:fixed;inset:0;width:100vw;height:100vh;background-color:#ffffff;display:flex;justify-content:center;align-items:center;z-index:99999999;overflow:hidden;cursor:pointer;transition:opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s cubic-bezier(0.16, 1, 0.3, 1);opacity:1;visibility:visible;user-select:none;-webkit-user-select:none;"
    >
      <video
        id="preplab-splash-video"
        autoplay
        muted
        playsinline
        preload="auto"
        style="opacity:0;transition:opacity 0.2s ease-in;background:transparent;max-width:720px;max-height:85vh;width:90vw;height:auto;object-fit:contain;display:block;pointer-events:none;filter:brightness(1.025) contrast(1.015);mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to right,rgba(0,0,0,0) 0%,rgba(0,0,0,1) 12%,rgba(0,0,0,1) 88%,rgba(0,0,0,0) 100%),linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,1) 12%,rgba(0,0,0,1) 88%,rgba(0,0,0,0) 100%);-webkit-mask-composite:destination-in;mask-image:linear-gradient(to right,rgba(0,0,0,0) 0%,rgba(0,0,0,1) 12%,rgba(0,0,0,1) 88%,rgba(0,0,0,0) 100%),linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,1) 12%,rgba(0,0,0,1) 88%,rgba(0,0,0,0) 100%);mask-composite:intersect;"
      >
        <source src="/Animasi_Splash_Screen_PrepLab.mp4" type="video/mp4" />
      </video>
      <div 
        class="preplab-skip-hint"
        style="position:absolute;bottom:24px;font-size:11px;color:#94a3b8;letter-spacing:0.5px;pointer-events:none;font-family:system-ui,-apple-system,sans-serif;"
      >
        Ketuk untuk lewati
      </div>
    </div>
    <script>
      (function() {
        try {
          var isEmbed = new URLSearchParams(window.location.search).get('embed') === 'true';
          var splash = document.getElementById('preplab-splash-screen');
          var video = document.getElementById('preplab-splash-video');
          if (isEmbed) {
            if (splash) splash.style.display = 'none';
            return;
          }
          if (!splash || !video) return;

          var isEnded = false;
          var ANIM_SPEED = 1.45;
          var SHINE_SPEED = 1.05;
          var SHINE_START = 5.2;

          function showVideo() {
            video.style.opacity = '1';
          }

          function dismissSplash() {
            if (isEnded) return;
            isEnded = true;
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            splash.style.pointerEvents = 'none';
            setTimeout(function() {
              splash.style.display = 'none';
            }, 350);
          }

          function onTimeUpdate() {
            if (video.currentTime < SHINE_START) {
              if (video.playbackRate !== ANIM_SPEED) video.playbackRate = ANIM_SPEED;
            } else {
              if (video.playbackRate !== SHINE_SPEED) video.playbackRate = SHINE_SPEED;
            }
          }

          video.playbackRate = ANIM_SPEED;
          // Hanya tampilkan video saat frame video sudah benar-benar siap berputar (menghilangkan flicker kotak hitam)
          video.addEventListener('playing', showVideo);
          video.addEventListener('canplay', showVideo);
          video.addEventListener('timeupdate', onTimeUpdate);
          video.addEventListener('ended', dismissSplash);
          splash.addEventListener('click', dismissSplash);
          video.addEventListener('error', dismissSplash);

          var playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise.then(function() {
              showVideo();
            }).catch(function() {
              setTimeout(dismissSplash, 4000);
            });
          }
        } catch(e) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
