# NOTE: File ini digunakan ketika Cloud Build Trigger aktif di Google Cloud Console.
# DEFAULT PROJECT TARGET: project-1bcc4549-c8d6-4962-958 (Akun Baru)
# JANGAN deploy ke project lama (project-054e3351-b8d1-42f7-9c8).
# Untuk deploy manual via CLI, gunakan: npm run deploy:main (otomatis target project baru)
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/preplab-portal:$COMMIT_SHA', '.']
  
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/preplab-portal:$COMMIT_SHA']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'preplab-portal'
      - '--image'
      - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/preplab-portal:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast2'
      - '--project'
      - '$PROJECT_ID'
      - '--update-secrets'
      - 'JWT_SECRET=JWT_SECRET:latest'

images:
  - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/preplab-portal:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY