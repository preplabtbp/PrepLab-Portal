<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Liquid Titanium Silver Gradient -->
    <linearGradient id="silverGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F1F5F9"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Silver Inner Bevel -->
    <linearGradient id="silverBevel1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Shade 1: Velvet Onyx Radial -->
    <radialGradient id="plateOnyx1" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1C1E26"/>
      <stop offset="45%" stop-color="#0E0F14"/>
      <stop offset="85%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow1)">
    <!-- Tactical Plate: Velvet Onyx -->
    <rect x="8" y="8" width="84" height="84" rx="14" fill="url(#plateOnyx1)" stroke="#2D3340" stroke-width="2"/>
    <!-- Inner Rim -->
    <rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="url(#silverBevel1)" stroke-width="1" opacity="0.35"/>

    <!-- Typography 1: Apex Octa-Grotesk (Extended Architectural dengan Sudut Chamfer Halus) -->
    <g fill="url(#silverGrad1)" stroke="#090C12" stroke-width="0.6" stroke-linejoin="round">
      <!-- Letter G -->
      <path d="M 46 38.5
               L 43.5 35
               C 41 33.5 38 32.5 34.5 32.5
               C 28 32.5 22.5 36.5 19.5 42.5
               C 18 45.5 17.5 48 17.5 50.5
               C 17.5 53 18 55.5 19.5 58.5
               C 22.5 64.5 28 68.5 34.5 68.5
               C 42 68.5 47 64 48.5 56.5
               L 48.5 50.5
               L 34.5 50.5
               L 34.5 54.5
               L 44.5 54.5
               C 43.5 60.5 39.5 64.5 34.5 64.5
               C 29.5 64.5 25 61 23 56
               C 22 53.5 21.5 52 21.5 50.5
               C 21.5 49 22 47.5 23 45
               C 25 40 29.5 36.5 34.5 36.5
               C 38 36.5 41 37.5 43.5 39.5
               Z"/>

      <!-- Letter M -->
      <path d="M 52.5 68
               L 52.5 33
               L 57 33
               L 66 52
               L 75 33
               L 79.5 33
               L 79.5 68
               L 75.5 68
               L 75.5 42
               L 67.5 59
               L 64.5 59
               L 56.5 42
               L 56.5 68
               Z"/>
    </g>
  </g>
</svg>
