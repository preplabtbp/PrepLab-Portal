<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Silver Titanium Gradient -->
    <linearGradient id="silverGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Silver Inner Bevel -->
    <linearGradient id="silverBevel1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Shade 1: Pure Onyx Radial -->
    <radialGradient id="plateOnyx" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="45%" stop-color="#101116"/>
      <stop offset="85%" stop-color="#07080A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow1)">
    <!-- Tactical Plate: Onyx Black -->
    <rect x="8" y="8" width="84" height="84" rx="14" fill="url(#plateOnyx)" stroke="#2B303C" stroke-width="2"/>
    <!-- Inner Rim -->
    <rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="url(#silverBevel1)" stroke-width="1" opacity="0.35"/>

    <!-- Typography 1: Architectural Extended Grotesk (Clean, Balanced, Masculine) -->
    <g fill="url(#silverGrad1)" stroke="#0F172A" stroke-width="0.6" stroke-linejoin="round">
      <!-- Letter G -->
      <path d="M 44 41
               C 42 37.5 39 36 34.5 36
               C 27.5 36 22 41.5 22 50
               C 22 58.5 27.5 64 35 64
               C 41.5 64 45.5 59.5 45.5 53
               L 34 53
               L 34 49
               L 49.5 49
               L 49.5 54
               C 49 62 43 68 34.5 68
               C 24.5 68 17.5 60 17.5 50
               C 17.5 40 24.5 32 35 32
               C 40.5 32 45.5 34.5 48.5 38.5
               Z"/>

      <!-- Letter M -->
      <path d="M 52.5 67
               L 52.5 33
               L 57 33
               L 66 52.5
               L 75 33
               L 79.5 33
               L 79.5 67
               L 75.5 67
               L 75.5 41.5
               L 67.5 59
               L 64.5 59
               L 56.5 41.5
               L 56.5 67
               Z"/>
    </g>
  </g>
</svg>
