      <polygon points="32,65 28.2,59.8 32.0,49.0" fill="url(#starFacetLight)" stroke="#334155" stroke-width="0.6"/><polygon points="32,65 32.0,49.0 35.8,59.8" fill="url(#starFacetDark)" stroke="#334155" stroke-width="0.6"/><polygon points="32,65 35.8,59.8 47.2,60.1" fill="url(#starFacetLight)" stroke="#334155" stroke-width="0.6"/><polygon points="32,65 47.2,60.1 38.1,67.0" fill="url(#starFacetDark)" stroke="#334155" stroke-width="0.6"/><polygon points="32,65 38.1,67.0 41.4,77.9" fill="url(#starFacetLight)" stroke="#334155" stroke-width="0.6"/><polygon points="32,65 41.4,77.9 32.0,71.4" fill="url(#starFacetDark)" stroke="#334155" stroke-width="0.6"/><polygon points="32,65 32.0,71.4 22.6,77.9" fill="url(#starFacetLight)" stroke="#334155" stroke-width="0.6"/><polygon points="32,65 22.6,77.9 25.9,67.0" fill="url(#starFacetDark)" stroke="#334155" stroke-width="0.6"/><polygon points="32,65 25.9,67.0 16.8,60.1" fill="url(#starFacetLight)" stroke="#334155" stroke-width="0.6"/><polygon points="32,65 16.8,60.1 28.2,59.8" fill="url(#starFacetDark)" stroke="#334155" stroke-width="0.6"/>
