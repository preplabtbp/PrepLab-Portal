      <polygon points="68,35 64.2,29.8 68.0,19.0" fill="url(#starFacetLight)" stroke="#334155" stroke-width="0.6"/><polygon points="68,35 68.0,19.0 71.8,29.8" fill="url(#starFacetDark)" stroke="#334155" stroke-width="0.6"/><polygon points="68,35 71.8,29.8 83.2,30.1" fill="url(#starFacetLight)" stroke="#334155" stroke-width="0.6"/><polygon points="68,35 83.2,30.1 74.1,37.0" fill="url(#starFacetDark)" stroke="#334155" stroke-width="0.6"/><polygon points="68,35 74.1,37.0 77.4,47.9" fill="url(#starFacetLight)" stroke="#334155" stroke-width="0.6"/><polygon points="68,35 77.4,47.9 68.0,41.4" fill="url(#starFacetDark)" stroke="#334155" stroke-width="0.6"/><polygon points="68,35 68.0,41.4 58.6,47.9" fill="url(#starFacetLight)" stroke="#334155" stroke-width="0.6"/><polygon points="68,35 58.6,47.9 61.9,37.0" fill="url(#starFacetDark)" stroke="#334155" stroke-width="0.6"/><polygon points="68,35 61.9,37.0 52.8,30.1" fill="url(#starFacetLight)" stroke="#334155" stroke-width="0.6"/><polygon points="68,35 52.8,30.1 64.2,29.8" fill="url(#starFacetDark)" stroke="#334155" stroke-width="0.6"/>
      <line x1="68" y1="35" x2="68.0" y2="19.0" stroke="#FFFFFF" stroke-width="0.85" opacity="0.9"/><line x1="68" y1="35" x2="83.2" y2="30.1" stroke="#FFFFFF" stroke-width="0.85" opacity="0.9"/><line x1="68" y1="35" x2="77.4" y2="47.9" stroke="#FFFFFF" stroke-width="0.85" opacity="0.9"/><line x1="68" y1="35" x2="58.6" y2="47.9" stroke="#FFFFFF" stroke-width="0.85" opacity="0.9"/><line x1="68" y1="35" x2="52.8" y2="30.1" stroke="#FFFFFF" stroke-width="0.85" opacity="0.9"/>
      <circle cx="68" cy="35" r="1.4" fill="#FFFFFF" opacity="0.95"/>
    </g>
  
