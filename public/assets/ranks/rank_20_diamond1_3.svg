<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">

  <defs>
    <!-- Silver / Titanium Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Silver Highlight Bevel -->
    <linearGradient id="silverBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#E2E8F0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Chiseled Star Facet Light (Facing light source) -->
    <linearGradient id="starFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Chiseled Star Facet Shadow (Facing away) -->
    <linearGradient id="starFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="60%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Gold Radiant Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Gold Bevel -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Gold Star Facet Light -->
    <linearGradient id="goldStarFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Gold Star Facet Shadow -->
    <linearGradient id="goldStarFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="60%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Crystalline Diamond (Cyan/Sapphire) -->
    <linearGradient id="diamondCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="25%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="85%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>

    <!-- Crystalline Diamond (Gold Topaz) -->
    <linearGradient id="diamondGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Diamond Facet Highlights (Cyan) -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="facetBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Diamond Facet Highlights (Gold) -->
    <linearGradient id="facetGoldTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="facetGoldBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Crimson Military Plate Gradient (Gambar 3 Reference) -->
    <radialGradient id="plateCrimson" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#6B1D22"/>
      <stop offset="50%" stop-color="#4A1216"/>
      <stop offset="85%" stop-color="#2D0A0C"/>
      <stop offset="100%" stop-color="#1A0406"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Gold Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="3.5" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  
    <!-- Plate Grey (Tengkorak & Strip) -->
    <radialGradient id="plateGrey" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="85%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Plate Brown Leather (V / Sersan) -->
    <radialGradient id="plateLeather" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#854D0E"/>
      <stop offset="45%" stop-color="#713F12"/>
      <stop offset="85%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#260E02"/>
    </radialGradient>

    <!-- Plate Blue (Diamond) -->
    <radialGradient id="plateBlue" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="45%" stop-color="#0369A1"/>
      <stop offset="85%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Plate Green (Major) -->
    <radialGradient id="plateGreen" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="45%" stop-color="#15803D"/>
      <stop offset="85%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#052E16"/>
    </radialGradient>

    <!-- Plate Crimson Red (Bintang) -->
    <radialGradient id="plateCrimson" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#6B1D22"/>
      <stop offset="50%" stop-color="#4A1216"/>
      <stop offset="85%" stop-color="#2D0A0C"/>
      <stop offset="100%" stop-color="#1A0406"/>
    </radialGradient>

    <!-- Plate Black Obsidian (GM) -->
    <radialGradient id="plateBlack" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181A22"/>
      <stop offset="50%" stop-color="#0D0E14"/>
      <stop offset="85%" stop-color="#05060A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Silver Facet Gradients for Diamond Replacement -->
    <linearGradient id="diamondSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="facetSilverTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="facetSilverBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.85"/>
    </linearGradient>

  </defs>

  <g filter="url(#badgeShadow)">

    <!-- Tactical Plate -->
    <rect x="8" y="8" width="84" height="84" rx="14" fill="url(#plateBlue)" stroke="#0369A1" stroke-width="2"/>
    <!-- Subtle Inner Metallic Rim -->
    <rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="url(#silverBevel)" stroke-width="1" opacity="0.4"/>
  

    
    
      <polygon points="50,19 71,46 50,73 29,46"
               fill="url(#diamondSilver)" stroke="#334155" stroke-width="1.5"/>
      <polygon points="50,19 50,46 29,46" fill="url(#facetSilverTop)" opacity="0.85"/>
      <polygon points="50,19 71,46 50,46" fill="#FFFFFF" opacity="0.45"/>
      <polygon points="29,46 50,46 50,73" fill="url(#facetSilverBottom)" opacity="0.6"/>
      <polygon points="50,46 71,46 50,73" fill="#1E293B" opacity="0.75"/>
      <line x1="50" y1="19" x2="50" y2="73" stroke="#FFFFFF" stroke-width="0.9" opacity="0.7"/>
      <line x1="29" y1="46" x2="71" y2="46" stroke="#FFFFFF" stroke-width="0.9" opacity="0.5"/>
    
    <g id="pips">
      <g transform="translate(33, 88)">
        <polygon points="0,-4 4,0 0,4 -4,0" fill="url(#silverGrad)" stroke="#1E293B" stroke-width="0.9"/>
        <polygon points="0,-3 3,0 0,0 -3,0" fill="#FFFFFF" opacity="0.6"/>
      </g>
    
      <g transform="translate(50, 88)">
        <polygon points="0,-4 4,0 0,4 -4,0" fill="url(#silverGrad)" stroke="#1E293B" stroke-width="0.9"/>
        <polygon points="0,-3 3,0 0,0 -3,0" fill="#FFFFFF" opacity="0.6"/>
      </g>
    
      <g transform="translate(67, 88)">
        <polygon points="0,-4 4,0 0,4 -4,0" fill="url(#silverGrad)" stroke="#1E293B" stroke-width="0.9"/>
        <polygon points="0,-3 3,0 0,0 -3,0" fill="#FFFFFF" opacity="0.6"/>
      </g>
    </g>
  
  </g>
</svg>