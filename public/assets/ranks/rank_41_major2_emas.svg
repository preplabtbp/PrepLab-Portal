<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">

  <defs>
    <!-- Silver / Titanium Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Silver Highlight Bevel -->
    <linearGradient id="silverBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#E2E8F0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Chiseled Star Facet Light (Facing light source) -->
    <linearGradient id="starFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Chiseled Star Facet Shadow (Facing away) -->
    <linearGradient id="starFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="60%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Gold Radiant Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Gold Bevel -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Gold Star Facet Light -->
    <linearGradient id="goldStarFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Gold Star Facet Shadow -->
    <linearGradient id="goldStarFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="60%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Crystalline Diamond (Cyan/Sapphire) -->
    <linearGradient id="diamondCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="25%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="85%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>

    <!-- Crystalline Diamond (Gold Topaz) -->
    <linearGradient id="diamondGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Diamond Facet Highlights (Cyan) -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="facetBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#082F49" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Diamond Facet Highlights (Gold) -->
    <linearGradient id="facetGoldTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="facetGoldBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Crimson Military Plate Gradient (Gambar 3 Reference) -->
    <radialGradient id="plateCrimson" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#6B1D22"/>
      <stop offset="50%" stop-color="#4A1216"/>
      <stop offset="85%" stop-color="#2D0A0C"/>
      <stop offset="100%" stop-color="#1A0406"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Gold Glow Filter -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="3.5" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow)">

    
      <circle cx="50" cy="44" r="38" fill="#F59E0B" opacity="0.2" filter="url(#goldGlow)"/>
    
    
    <g id="star8">
      <polygon points="31,45 28.2,38.3 31.0,19.0" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 31.0,19.0 33.8,38.3" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 33.8,38.3 46.1,29.9" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 46.1,29.9 37.7,42.2" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 37.7,42.2 57.0,45.0" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 57.0,45.0 37.7,47.8" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 37.7,47.8 46.1,60.1" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 46.1,60.1 33.8,51.7" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 33.8,51.7 31.0,71.0" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 31.0,71.0 28.2,51.7" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 28.2,51.7 15.9,60.1" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 15.9,60.1 24.3,47.8" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 24.3,47.8 5.0,45.0" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 5.0,45.0 24.3,42.2" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 24.3,42.2 15.9,29.9" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="31,45 15.9,29.9 28.2,38.3" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/>
      <line x1="31" y1="45" x2="31.0" y2="19.0" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="31" y1="45" x2="46.1" y2="29.9" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="31" y1="45" x2="57.0" y2="45.0" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="31" y1="45" x2="46.1" y2="60.1" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="31" y1="45" x2="31.0" y2="71.0" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="31" y1="45" x2="15.9" y2="60.1" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="31" y1="45" x2="5.0" y2="45.0" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="31" y1="45" x2="15.9" y2="29.9" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/>
      <!-- Central Apex Highlight -->
      <circle cx="31" cy="45" r="2.1" fill="#FEF08A" opacity="0.9"/>
    </g>
  
    <g id="star8">
      <polygon points="69,45 66.2,38.3 69.0,19.0" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 69.0,19.0 71.8,38.3" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 71.8,38.3 84.1,29.9" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 84.1,29.9 75.7,42.2" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 75.7,42.2 95.0,45.0" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 95.0,45.0 75.7,47.8" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 75.7,47.8 84.1,60.1" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 84.1,60.1 71.8,51.7" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 71.8,51.7 69.0,71.0" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 69.0,71.0 66.2,51.7" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 66.2,51.7 53.9,60.1" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 53.9,60.1 62.3,47.8" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 62.3,47.8 43.0,45.0" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 43.0,45.0 62.3,42.2" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 62.3,42.2 53.9,29.9" fill="url(#goldStarFacetLight)" stroke="#78350F" stroke-width="0.6"/><polygon points="69,45 53.9,29.9 66.2,38.3" fill="url(#goldStarFacetDark)" stroke="#78350F" stroke-width="0.6"/>
      <line x1="69" y1="45" x2="69.0" y2="19.0" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="69" y1="45" x2="84.1" y2="29.9" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="69" y1="45" x2="95.0" y2="45.0" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="69" y1="45" x2="84.1" y2="60.1" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="69" y1="45" x2="69.0" y2="71.0" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="69" y1="45" x2="53.9" y2="60.1" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="69" y1="45" x2="43.0" y2="45.0" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/><line x1="69" y1="45" x2="53.9" y2="29.9" stroke="#FEF08A" stroke-width="0.8" opacity="0.85"/>
      <!-- Central Apex Highlight -->
      <circle cx="69" cy="45" r="2.1" fill="#FEF08A" opacity="0.9"/>
    </g>
  
    
  
  </g>
</svg>