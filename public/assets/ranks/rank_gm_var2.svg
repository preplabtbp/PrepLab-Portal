<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Chromium Platinum Gradient -->
    <linearGradient id="silverGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Silver Inner Bevel -->
    <linearGradient id="silverBevel2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Shade 2: Smoked Obsidian Graphite -->
    <radialGradient id="plateObsidian2" cx="50%" cy="42%" r="66%">
      <stop offset="0%" stop-color="#1F242F"/>
      <stop offset="42%" stop-color="#10131A"/>
      <stop offset="85%" stop-color="#050609"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow2)">
    <!-- Tactical Plate: Smoked Obsidian -->
    <rect x="8" y="8" width="84" height="84" rx="14" fill="url(#plateObsidian2)" stroke="#333C4E" stroke-width="2"/>
    <!-- Inner Rim -->
    <rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="url(#silverBevel2)" stroke-width="1" opacity="0.35"/>

    <!-- Typography 2: Stealth Intercept Extended (Wide Square-Grotesk Architecture) -->
    <g fill="url(#silverGrad2)" stroke="#090C12" stroke-width="0.6" stroke-linejoin="round">
      <!-- Letter G: Squared curved shoulders, wide presence -->
      <path d="M 46 39
               L 41.5 39
               C 39.5 36.5 36.5 35.5 33.5 35.5
               C 26 35.5 21 41 21 50.5
               C 21 60 26 65.5 33.5 65.5
               C 40 65.5 44 61.5 44.5 55
               L 33.5 55
               L 33.5 51
               L 49 51
               L 49 55.5
               C 48 64.5 42 69.5 33.5 69.5
               C 23.5 69.5 16.5 61 16.5 50.5
               C 16.5 40 23.5 31.5 33.5 31.5
               C 39 31.5 44.5 34 47.5 38.5
               Z"/>

      <!-- Letter M: Extended Wing Geometry with Razor Intercept Center -->
      <path d="M 52.5 68
               L 52.5 33
               L 57.5 33
               L 66 50.5
               L 74.5 33
               L 79.5 33
               L 79.5 68
               L 75 68
               L 75 41
               L 67.5 56.5
               L 64.5 56.5
               L 57 41
               L 57 68
               Z"/>
    </g>
  </g>
</svg>
