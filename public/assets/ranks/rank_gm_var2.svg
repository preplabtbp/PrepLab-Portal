<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Platinum Silver Gradient -->
    <linearGradient id="silverGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Silver Inner Bevel -->
    <linearGradient id="silverBevel2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shade 2: Carbon Matte Dark Charcoal -->
    <radialGradient id="plateCarbon" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#242933"/>
      <stop offset="40%" stop-color="#15181E"/>
      <stop offset="80%" stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow2)">
    <!-- Tactical Plate: Carbon Black -->
    <rect x="8" y="8" width="84" height="84" rx="14" fill="url(#plateCarbon)" stroke="#384152" stroke-width="2"/>
    <!-- Inner Rim -->
    <rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="url(#silverBevel2)" stroke-width="1" opacity="0.35"/>

    <!-- Typography 2: Stealth Razor Stencil (Clean, Decisive, High Precision) -->
    <g fill="url(#silverGrad2)" stroke="#090B0E" stroke-width="0.5" stroke-linejoin="miter">
      <!-- Letter G with subtle tactical gap cut -->
      <!-- Top Arc -->
      <path d="M 48 37.5
               C 45 33.5 40 31.5 34.5 31.5
               C 24 31.5 17 39.5 17 50
               C 17 60.5 24 68.5 34.5 68.5
               C 43.5 68.5 48.5 62.5 49 55
               L 35 55
               L 35 51
               L 49 51
               L 49 55
               C 48.5 60.5 44 65 34.5 65
               C 26 65 21 58.5 21 50
               C 21 41.5 26 35 34.5 35
               C 39 35 43 36.5 45.5 39.5
               Z"/>

      <!-- Letter M: Razor Military Apex -->
      <!-- Left Pillar -->
      <polygon points="53,32 57,32 57,68 53,68"/>
      <!-- Right Pillar -->
      <polygon points="75,32 79,32 79,68 75,68"/>
      <!-- Center Chevron Apex -->
      <path d="M 57 32
               L 66 49
               L 75 32
               L 78.5 32
               L 67.5 54
               L 64.5 54
               L 53.5 32
               Z"/>
      <polygon points="64.5,58 67.5,58 67.5,68 64.5,68"/>
    </g>
  </g>
</svg>
