<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Liquid Mercury Chrome Gradient -->
    <linearGradient id="silverGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F1F5F9"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Silver Inner Bevel -->
    <linearGradient id="silverBevel5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Shade 5: Smoked Gunmetal Titanium -->
    <radialGradient id="plateGunmetal5" cx="50%" cy="42%" r="66%">
      <stop offset="0%" stop-color="#242A38"/>
      <stop offset="42%" stop-color="#131620"/>
      <stop offset="85%" stop-color="#05070B"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow5)">
    <!-- Tactical Plate: Gunmetal Titanium -->
    <rect x="8" y="8" width="84" height="84" rx="14" fill="url(#plateGunmetal5)" stroke="#3E495D" stroke-width="2"/>
    <!-- Inner Rim -->
    <rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="url(#silverBevel5)" stroke-width="1" opacity="0.35"/>

    <!-- Typography 5: Apex Razor-Hex Vanguard (Hexagonal Chamfered Tactical Precision) -->
    <g fill="url(#silverGrad5)" stroke="#090C12" stroke-width="0.5" stroke-linejoin="miter">
      <!-- Letter G: Sharp Hexagonal Monoline Face with Angled Terminal -->
      <polygon points="
        29,32.5 46.5,32.5 46.5,37 31,37 23,45 23,56 31,64 42,64 45.5,60.5 45.5,53.5 35,53.5 35,49.5 49.5,49.5 49.5,62 43,68.5 29,68.5 18.5,58 18.5,43
      "/>

      <!-- Letter M: Razor-Hex Faceted Chevron Vertex -->
      <polygon points="
        53,68 53,32.5 58,32.5 66,48 74,32.5 79,32.5 79,68 74.5,68 74.5,42.5 68,54.5 64,54.5 57.5,42.5 57.5,68
      "/>
    </g>
  </g>
</svg>
