<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Liquid Platinum Silver Gradient -->
    <linearGradient id="silverGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Silver Inner Bevel -->
    <linearGradient id="silverBevel4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Shade 4: Deep Carbon Obsidian -->
    <radialGradient id="plateCarbon4" cx="50%" cy="42%" r="66%">
      <stop offset="0%" stop-color="#1B1F2A"/>
      <stop offset="42%" stop-color="#0D0F15"/>
      <stop offset="85%" stop-color="#040507"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow4)">
    <!-- Tactical Plate: Deep Carbon Obsidian -->
    <rect x="8" y="8" width="84" height="84" rx="14" fill="url(#plateCarbon4)" stroke="#2F3847" stroke-width="2"/>
    <!-- Inner Rim -->
    <rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="url(#silverBevel4)" stroke-width="1" opacity="0.35"/>

    <!-- Typography 4: Aero Monolith (Authoritative Architectural Extended dengan Inset Chamfer) -->
    <g fill="url(#silverGrad4)" stroke="#090C12" stroke-width="0.6" stroke-linejoin="round">
      <!-- Letter G: Heavy low-profile architectural curve with chamfered spur -->
      <path d="M 47 40
               L 42.5 40
               C 40.5 36 37 34.5 33.5 34.5
               C 25.5 34.5 20.5 40.5 20.5 50.5
               C 20.5 60.5 25.5 66.5 33.5 66.5
               C 40.5 66.5 44.5 62 45 54.5
               L 35 54.5
               L 35 50
               L 50 50
               L 50 56
               C 49 65 42.5 70.5 33.5 70.5
               C 22.5 70.5 15.5 61.5 15.5 50.5
               C 15.5 39.5 22.5 30.5 33.5 30.5
               C 39.5 30.5 45.5 33.5 48.5 38.5
               Z"/>

      <!-- Letter M: Monolithic Wide Stems with Chamfered Internal Slopes -->
      <path d="M 53 68
               L 53 32
               L 58.5 32
               L 66 48
               L 73.5 32
               L 79 32
               L 79 68
               L 74 68
               L 74 41
               L 67.5 54.5
               L 64.5 54.5
               L 58 41
               L 58 68
               Z"/>
    </g>
  </g>
</svg>
