<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Brilliant Polished Silver / White Gold Gradient -->
    <linearGradient id="silverGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F1F5F9"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="85%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Silver Inner Bevel -->
    <linearGradient id="silverBevel4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Shade 4: Midnight Obsidian Black (Cold Gunmetal Hue) -->
    <radialGradient id="plateMidnight" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#181C26"/>
      <stop offset="45%" stop-color="#0E1017"/>
      <stop offset="85%" stop-color="#050609"/>
      <stop offset="100%" stop-color="#000102"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow4)">
    <!-- Tactical Plate: Midnight Obsidian Black -->
    <rect x="8" y="8" width="84" height="84" rx="14" fill="url(#plateMidnight)" stroke="#2B3242" stroke-width="2"/>
    <!-- Inner Rim -->
    <rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="url(#silverBevel4)" stroke-width="1" opacity="0.35"/>

    <!-- Typography 4: Chiseled Apex Serif (Regal, Mysterious, High-Authority Game Master) -->
    <g fill="url(#silverGrad4)" stroke="#090D14" stroke-width="0.5" stroke-linejoin="round">
      <!-- Letter G -->
      <path d="M 46 39
               L 47.5 35
               L 43 35
               C 40 33 36.5 32 33 32
               C 22.5 32 17 39.5 17 50
               C 17 60.5 22.5 68 33.5 68
               C 42.5 68 47.5 61.5 48 53
               L 33 53
               L 33 49
               L 49.5 49
               L 49.5 54
               C 49 63 42.5 69.5 33.5 69.5
               C 21.5 69.5 15 61 15 50
               C 15 39 21.5 30.5 33 30.5
               C 38 30.5 42.5 32 46.5 35
               L 47 31
               L 49 31
               L 47.5 39
               Z"/>

      <!-- Letter M: High Roman Architecture -->
      <path d="M 51 68
               L 51 66
               L 53.5 66
               L 53.5 35
               L 51 35
               L 51 33
               L 57.5 33
               L 66 53.5
               L 74.5 33
               L 81 33
               L 81 35
               L 78.5 35
               L 78.5 66
               L 81 66
               L 81 68
               L 74.5 68
               L 74.5 66
               L 76.5 66
               L 76.5 37
               L 67.5 59
               L 64.5 59
               L 55.5 37
               L 55.5 66
               L 57.5 66
               L 57.5 68
               Z"/>
    </g>
  </g>
</svg>
