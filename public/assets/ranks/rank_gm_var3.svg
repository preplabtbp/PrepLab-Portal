<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Sharp Mercury Titanium Gradient -->
    <linearGradient id="silverGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F1F5F9"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Silver Inner Bevel -->
    <linearGradient id="silverBevel3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Shade 3: Smoked Tungsten Graphite Metal -->
    <radialGradient id="plateTungsten3" cx="50%" cy="42%" r="66%">
      <stop offset="0%" stop-color="#232835"/>
      <stop offset="42%" stop-color="#12151E"/>
      <stop offset="85%" stop-color="#06080C"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow3)">
    <!-- Tactical Plate: Tungsten Graphite -->
    <rect x="8" y="8" width="84" height="84" rx="14" fill="url(#plateTungsten3)" stroke="#3A4456" stroke-width="2"/>
    <!-- Inner Rim -->
    <rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="url(#silverBevel3)" stroke-width="1" opacity="0.35"/>

    <!-- Typography 3: Pure Hex Chamfer V2 (Evolusi Sempurna Desain 5, 45° Aerospace Stealth) -->
    <g fill="url(#silverGrad3)" stroke="#090C12" stroke-width="0.5" stroke-linejoin="bevel">
      <!-- Letter G: 45° Chamfered Outer and Inner Geometry -->
      <polygon points="
        28,31.5 46.5,31.5 46.5,36 30.5,36 22,44.5 22,56.5 30.5,65 42,65 45.5,61.5 45.5,52.5 34,52.5 34,48 49.5,48 49.5,63 43,69.5 28.5,69.5 17.5,58.5 17.5,42.5
      "/>

      <!-- Letter M: 45° Chamfered Heavy Stems -->
      <polygon points="
        52.5,68 52.5,32 57.5,32 66,49.5 74.5,32 79.5,32 79.5,68 75,68 75,41.5 68,55.5 64,55.5 57,41.5 57,68
      "/>
    </g>
  </g>
</svg>
