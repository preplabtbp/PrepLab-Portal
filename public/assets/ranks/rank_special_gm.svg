<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">

  <defs>

    <!-- Dark steel plate -->
    <radialGradient id="plate" cx="38%" cy="32%" r="75%">
      <stop offset="0%"   stop-color="#1C1C2E"/>
      <stop offset="55%"  stop-color="#0D0D1A"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <!-- Border: subtle crimson-to-dark -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3D0C0C"/>
      <stop offset="40%"  stop-color="#7F1D1D"/>
      <stop offset="60%"  stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#3D0C0C"/>
    </linearGradient>

    <!-- Inner bevel: very subtle -->
    <linearGradient id="bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>

    <!-- GM text: cold silver-white -->
    <linearGradient id="gmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="30%"  stop-color="#E2E8F0"/>
      <stop offset="65%"  stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Thin top-edge light reflection -->
    <linearGradient id="edgeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="30%"  stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="70%"  stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- GM text subtle glow: deep red -->
    <filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3"   flood-color="#7F1D1D" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#FFFFFF"  flood-opacity="0.15"/>
    </filter>

    <!-- Thin diagonal scratch texture overlay (noise-like) -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noiseOut"/>
      <feColorMatrix in="noiseOut" type="saturate" values="0" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>

  </defs>

  <g filter="url(#shadow)">

    <!-- Main plate: square with slightly rounded corners, like a military dog tag -->
    <rect x="8" y="8" width="84" height="84" rx="10"
          fill="url(#plate)"/>

    <!-- Outer border: dark crimson -->
    <rect x="8" y="8" width="84" height="84" rx="10"
          fill="none" stroke="url(#border)" stroke-width="2"/>

    <!-- Inner bevel (very faint) -->
    <rect x="11" y="11" width="78" height="78" rx="8"
          fill="url(#bevel)"/>

    <!-- Top edge light reflection (single thin line) -->
    <rect x="11" y="11" width="78" height="1.2" rx="0.6"
          fill="url(#edgeLight)"/>

    <!-- Left edge thin light reflection -->
    <rect x="11" y="11" width="1.2" height="78" rx="0.6"
          fill="url(#edgeLight)"/>

    <!-- Subtle center vignette (darker middle to push text forward) -->
    <rect x="8" y="8" width="84" height="84" rx="10"
          fill="none"
          stroke="#000000" stroke-width="8" stroke-opacity="0.18"/>

    <!-- Single thin horizontal rule above text -->
    <line x1="22" y1="38" x2="78" y2="38"
          stroke="#7F1D1D" stroke-width="0.7" opacity="0.7"/>

    <!-- Single thin horizontal rule below text -->
    <line x1="22" y1="65" x2="78" y2="65"
          stroke="#7F1D1D" stroke-width="0.7" opacity="0.7"/>

    <!-- The GM text — bold, cold, centered -->
    <g filter="url(#textGlow)">
      <text
        x="50" y="61"
        text-anchor="middle"
        dominant-baseline="auto"
        font-family="'Impact', 'Arial Black', 'Haettenschweiler', sans-serif"
        font-size="36"
        font-weight="900"
        letter-spacing="3"
        fill="url(#gmGrad)"
      >GM</text>
    </g>

    <!-- Hairline bevel on GM text (top-lit illusion) -->
    <text
      x="50" y="61"
      text-anchor="middle"
      dominant-baseline="auto"
      font-family="'Impact', 'Arial Black', 'Haettenschweiler', sans-serif"
      font-size="36"
      font-weight="900"
      letter-spacing="3"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="0.4"
      opacity="0.18"
    >GM</text>

    <!-- Four corner dots: military precision -->
    <circle cx="16" cy="16" r="1.5" fill="#7F1D1D" opacity="0.7"/>
    <circle cx="84" cy="16" r="1.5" fill="#7F1D1D" opacity="0.7"/>
    <circle cx="16" cy="84" r="1.5" fill="#7F1D1D" opacity="0.7"/>
    <circle cx="84" cy="84" r="1.5" fill="#7F1D1D" opacity="0.7"/>

  </g>

</svg>
