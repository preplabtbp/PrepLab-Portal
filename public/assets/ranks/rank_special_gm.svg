<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Sharp Chromium Silver Gradient -->
    <linearGradient id="silverGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F1F5F9"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="85%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Silver Inner Bevel -->
    <linearGradient id="silverBevel5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Shade: Smoked Tungsten Dark Metal -->
    <radialGradient id="plateTungsten" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#222733"/>
      <stop offset="45%" stop-color="#12151D"/>
      <stop offset="85%" stop-color="#07090D"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="badgeShadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g filter="url(#badgeShadow5)">
    <!-- Tactical Plate: Smoked Tungsten Dark Metal (Murni Box Kotak Tanpa Aksesoris) -->
    <rect x="8" y="8" width="84" height="84" rx="14" fill="url(#plateTungsten)" stroke="#384154" stroke-width="2"/>
    <!-- Inner Rim -->
    <rect x="10" y="10" width="80" height="80" rx="12" fill="none" stroke="url(#silverBevel5)" stroke-width="1" opacity="0.35"/>

    <!-- Typography: 45-Degree Chamfered Stealth Geometry -->
    <g fill="url(#silverGrad5)" stroke="#090D14" stroke-width="0.5" stroke-linejoin="bevel">
      <!-- Letter G (Chamfered Octagonal Flow) -->
      <polygon points="
        28,32 46,32 46,36.5 30,36.5 22,44.5 22,55.5 30,63.5 42,63.5 45.5,60 45.5,52 35,52 35,48 49.5,48 49.5,61.5 43.5,67.5 28.5,67.5 18,57 18,43
      "/>

      <!-- Letter M (45-Degree Chamfered Stealth Pillars) -->
      <polygon points="
        53,67 53,33 57.5,33 65.5,49.5 73.5,33 78,33 78,67 73.5,67 73.5,42 67,55 64,55 57.5,42 57.5,67
      "/>
    </g>
  </g>
</svg>