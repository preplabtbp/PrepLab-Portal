      <line x1="50" y1="27" x2="50.0" y2="5.0" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/><line x1="50" y1="27" x2="62.8" y2="14.2" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/><line x1="50" y1="27" x2="72.0" y2="27.0" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/><line x1="50" y1="27" x2="62.8" y2="39.8" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/><line x1="50" y1="27" x2="50.0" y2="49.0" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/><line x1="50" y1="27" x2="37.2" y2="39.8" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/><line x1="50" y1="27" x2="28.0" y2="27.0" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/><line x1="50" y1="27" x2="37.2" y2="14.2" stroke="#FFFFFF" stroke-width="0.8" opacity="0.85"/>
      <!-- Central Apex Highlight -->
      <circle cx="50" cy="27" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    </g>
  
